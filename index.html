<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIFTORA | Premium Corporate Gifts, GSAP Animations & Shadcn UI</title>
    <meta name="description" content="Elevate corporate branding with luxury custom gifts, executive onboarding hampers, GSAP interactive box builder, and real-time quote calculation." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- GSAP (GreenSock) CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- React & Babel Standalone CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="stylesheet" href="./src/index.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- Vite module entry -->
    <script type="module" src="./src/main.jsx"></script>

    <!-- Browser Direct Fallback Loader -->
    <script type="text/babel" data-presets="react" src="./src/App.jsx"></script>
    <script type="text/babel" data-presets="react">
      if (typeof window !== 'undefined' && window.React && window.ReactDOM && !window.__vite_plugin_react_preamble_installed__) {
        const rootElement = document.getElementById('root');
        if (rootElement && !rootElement.hasChildNodes() && window.App) {
          const root = ReactDOM.createRoot(rootElement);
          root.render(React.createElement(window.App));
        }
      }
    </script>
  </body>
</html>
