<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kawal Money — Pengurusan Kewangan & Sambungan Bank Malaysia</title>
  <meta name="description" content="Kawal Money adalah platform pengurusan kewangan peribadi moden di Malaysia. Sambungkan kad bank Maybank, CIMB, Bank Islam & Touch 'n Go eWallet anda dengan selamat." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              900: '#064e3b',
            },
            maybank: {
              DEFAULT: '#F7C900',
              dark: '#D6AE00',
            },
            cimb: {
              DEFAULT: '#ED1C24',
              dark: '#B80F15',
            },
            bankislam: {
              DEFAULT: '#008080',
              burgundy: '#7A0026',
            },
            tng: {
              DEFAULT: '#005FA4',
              accent: '#0084E3',
            },
            slate: {
              950: '#090d16',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans (UI), Outfit (Headings), JetBrains Mono (Financial Numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Design System Styles -->
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- GSAP & Plugins -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 antialiased selection:bg-emerald-400 selection:text-slate-950 font-sans">
  <div id="root"></div>

  <!-- Kawal Money Main Application Logic (React + GSAP) -->
  <script type="text/babel" src="./js/app.js"></script>
</body>
</html>
